<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Scientific Glass Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="calculator-wrapper">
        <div class="calculator">
            <a href="home.html" class="home-link">
                <span>←</span> Back to Home
            </a>
            <div class="display">
                <div class="history" id="history"></div>
                <div class="current-value" id="display">0</div>
            </div>

            <div class="keys">
                <!-- Row 1 -->
                <button class="clear" data-action="all-clear">AC</button>
                <button class="clear" data-action="clear">C</button>
                <button class="func" data-func="fact">n!</button>
                <button class="operator" data-action="bracket-open">(</button>
                <button class="operator" data-action="bracket-close">)</button>

                <!-- Row 2 -->
                <button class="func" data-func="sin">sin</button>
                <button data-num="7">7</button>
                <button data-num="8">8</button>
                <button data-num="9">9</button>
                <button class="operator" data-op="/">÷</button>

                <!-- Row 3 -->
                <button class="func" data-func="cos">cos</button>
                <button data-num="4">4</button>
                <button data-num="5">5</button>
                <button data-num="6">6</button>
                <button class="operator" data-op="*">×</button>

                <!-- Row 4 -->
                <button class="func" data-func="tan">tan</button>
                <button data-num="1">1</button>
                <button data-num="2">2</button>
                <button data-num="3">3</button>
                <button class="operator" data-op="-">−</button>

                <!-- Row 5 -->
                <button class="func" data-func="log">log</button>
                <button data-num="0">0</button>
                <button data-num=".">.</button>
                <button class="operator" data-op="^">^</button>
                <button class="operator" data-op="+">+</button>

                <!-- Row 6 -->
                <button class="func" data-func="ln">ln</button>
                <button class="func" data-func="sqrt">√</button>
                <button class="operator" data-op="%">mod</button>
                <button class="equals" data-action="calculate">=</button>
            </div>
            <div class="calculator-footer">
                Engineered by <strong>NAMRADHA</strong>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
